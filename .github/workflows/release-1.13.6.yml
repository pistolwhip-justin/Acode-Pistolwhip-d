name: Release 1.13.6

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-1.13.6.yml"
      - "README.md"
      - "config.xml"
      - "package.json"
      - "utils/config.js"
      - "utils/setup.js"
      - "build-extras.gradle"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acode-pistolwhip-release-1.13.6
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Pro / no-ad APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Check release state
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.13.6"
          APK_NAME="Acode-Pistolwhip-1.13.6.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            ASSET_PRESENT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '[.assets[].name] | index("'"$APK_NAME"'") != null')"
            if [ "$ASSET_PRESENT" = "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Verified release already exists; nothing will be overwritten."
              exit 0
            fi
            echo "::error::Release $TAG exists but is incomplete. Refusing to modify it."
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists without a verified release."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        if: steps.release_guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        if: steps.release_guard.outputs.skip != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Node.js
        if: steps.release_guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        if: steps.release_guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Verify source configuration
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          grep -F 'const ID_PAID = "com.pistolwhip.acode";' utils/config.js
          grep -F 'const ID_PAID = "com.pistolwhip.acode";' utils/setup.js
          grep -F "namespace 'com.foxdebug.acode'" build-extras.gradle
          grep -F 'config.HAS_PRO = !isFreePackage;' src/main.js
          grep -F 'version="1.13.6"' config.xml
          test -d codemirror-lsp-client
          test "$(find codemirror-lsp-client -maxdepth 1 -type f | wc -l)" -gt 0

      - name: Install dependencies and initialize Cordova
        if: steps.release_guard.outputs.skip != 'true'
        run: pnpm run setup

      - name: Run automated tests
        if: steps.release_guard.outputs.skip != 'true'
        run: pnpm run test

      - name: Run type checks
        if: steps.release_guard.outputs.skip != 'true'
        run: pnpm run typecheck

      - name: Build paid variant (Pro enabled, ads excluded)
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          pnpm run build paid dev apk
          test -f platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test ! -d plugins/admob-plus-cordova

      - name: Verify and name APK
        if: steps.release_guard.outputs.skip != 'true'
        id: apk
        run: |
          APK="Acode-Pistolwhip-1.13.6.apk"
          SOURCE="platforms/android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SOURCE"
          APP_ID="$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$SOURCE")"
          test "$APP_ID" = "com.pistolwhip.acode"
          mkdir -p release
          cp "$SOURCE" "release/$APK"
          SHA256="$(sha256sum "release/$APK" | awk '{print $1}')"
          echo "apk_name=$APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "application_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        if: steps.release_guard.outputs.skip != 'true'
        run: |
          cat > release-notes.md <<'EOF'
          # Acode — Pistol Whip Edition 1.13.6

          First Pistol Whip test release, built from the complete Acode upstream source.

          - Pro features enabled through Acode's documented paid build variant.
          - AdMob and legacy consent plugin integration excluded.
          - Android package: com.pistolwhip.acode (can coexist with the official package).
          - Debug/sideload APK, signed with the runner's Android debug key.
          - Automated tests and type checks run before publication.

          Physical-device installation and runtime behavior still require testing. This is not a Play Store or production-signing release.
          EOF
          printf '\nAPK SHA-256: %s\n' "${{ steps.apk.outputs.apk_sha256 }}" >> release-notes.md

      - name: Publish immutable GitHub Release
        if: steps.release_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.13.6" "release/${{ steps.apk.outputs.apk_name }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Acode Pistol Whip 1.13.6" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Verify release, tag, asset, and checksum
        if: steps.release_guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.13.6"
          APK_NAME="${{ steps.apk.outputs.apk_name }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          test "$TAG_COMMIT" = "$GITHUB_SHA"
          RELEASE_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          ASSET_URL="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .browser_download_url')"
          ASSET_DIGEST="$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$APK_NAME" '.assets[] | select(.name == $name) | .digest')"
          test -n "$ASSET_URL"
          test "$ASSET_URL" != "null"
          test "$ASSET_DIGEST" = "sha256:${{ steps.apk.outputs.apk_sha256 }}"
          echo "Release published: $ASSET_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "APK SHA-256: ${{ steps.apk.outputs.apk_sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit and release tag: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
